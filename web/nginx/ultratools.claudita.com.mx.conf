# UltraTools: portada de las apps y páginas de soporte y privacidad para la App Store.
# Va en ~/Documents/NGINX/nginx/conf.d/ultratools.claudita.com.mx.conf de la Mac mini.
# Archivos en ~/Documents/NGINX/sites/ultratools (los publica scripts/site-deploy.sh).
# /ultravocal/ sirve la carpeta de UltraVocal tal cual (la publica su propio proyecto), y
# ultravocal.claudita.com.mx sigue funcionando igual.
server {
    listen 80;
    server_name ultratools.claudita.com.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ultratools.claudita.com.mx;

    ssl_certificate /etc/letsencrypt/live/ultratools.claudita.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultratools.claudita.com.mx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/sites/ultratools;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /ultravocal/ {
        root /usr/share/nginx/sites;
        try_files $uri $uri.html $uri/ =404;
    }
}
