name: UltraScanner
options:
  bundleIdPrefix: mx.com.claudita
  # Textos escritos en español; el inglés vive en Localizable.xcstrings / InfoPlist.xcstrings.
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    # La subida al App Store pone uno nuevo en cada compilación (fecha y hora).
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  UltraScanner:
    type: application
    platform: iOS
    sources:
      - path: UltraScanner
      - path: Shared
    entitlements:
      path: UltraScanner/UltraScanner.entitlements
      properties:
        # Buzón compartido con la extensión de Compartir (Shared/SharedInbox.swift).
        com.apple.security.application-groups: [group.mx.com.claudita.ultrascanner]
    info:
      path: UltraScanner/Info.plist
      properties:
        CFBundleDisplayName: UltraScanner
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Fotos y PDFs compartidos desde otras apps llegan por la extensión UltraScannerShare (una
        # o varias a la vez), que abre la app con ultrascanner://import (Import/ImportInbox.swift).
        CFBundleURLTypes:
          - CFBundleURLName: mx.com.claudita.ultrascanner.import
            CFBundleURLSchemes: [ultrascanner]
        NSCameraUsageDescription: "UltraScanner necesita la cámara para escanear tus documentos."
        NSFaceIDUsageDescription: "Usamos Face ID para que solo tú puedas abrir tus documentos."
        NSUserTrackingUsageDescription: "UltraScanner es gratis gracias a un anuncio al compartir. Con tu permiso, los anuncios pueden ser más relevantes para ti."
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        USInterstitialAdUnitID: $(ADMOB_INTERSTITIAL_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        # El cifrado de la app es el del sistema: CryptoKit y SQLCipher sobre CommonCrypto de
        # Apple, solo para proteger los datos del propio usuario en el iPhone. No hace falta
        # documentación de exportación.
        ITSAppUsesNonExemptEncryption: false
        # Firebase Analytics (Analytics/AppAnalytics.swift): apagado hasta que la app lo arranca, y
        # con almacenamiento negado hasta que se sabe el consentimiento (formulario de Google).
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_ANALYTICS_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_STORAGE: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_USER_DATA: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.com.claudita.ultrascanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor # Views/Shared/Theme.swift
        TARGETED_DEVICE_FAMILY: "1"
        # SQLCipher primero: Firebase Analytics enlaza el SQLite del sistema (libsqlite3) y, si gana
        # ese, la base de datos deja de abrirse y de cifrarse. Lo revisa testSQLiteIsSQLCipher.
        # -ObjC lo pide Firebase Analytics.
        OTHER_LDFLAGS: $(inherited) -framework SQLCipher -ObjC
        # Firma manual con perfiles hechos por la API (scripts/asc_profile.py): la llave de API no
        # puede pedirle a Xcode perfiles con App Groups. Al exportar a la tienda se vuelve a firmar
        # con los de distribución (mac-appstore.sh).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: UltraScanner Dev
        DEVELOPMENT_TEAM: C6XD8H2J47  # Fernando Jimenez Gordillo (Apple Developer Program)
        # Debug usa los IDs de prueba de Google (anuncios de ejemplo); Release, los de la cuenta.
        # mac-appstore.sh se detiene si Release lleva los de prueba.
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_INTERSTITIAL_ID: ca-app-pub-3940256099942544/4411468910
      configs:
        # Cuenta de AdMob: app «UltraScanner», bloque intersticial «Compartir documento».
        Release:
          ADMOB_APP_ID: ca-app-pub-4632667318066503~9191146576
          ADMOB_INTERSTITIAL_ID: ca-app-pub-4632667318066503/1683443212
    dependencies:
      - target: UltraScannerShare
      - package: GRDB
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseAnalytics
    scheme:
      testTargets:
        - UltraScannerTests

  # Compartir › UltraScanner desde Fotos, WhatsApp, Mail, Archivos…: copia las fotos y PDFs al buzón
  # del App Group y abre la app, que los junta en un documento.
  UltraScannerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: UltraScannerShare
      - path: Shared
    entitlements:
      path: UltraScannerShare/UltraScannerShare.entitlements
      properties:
        com.apple.security.application-groups: [group.mx.com.claudita.ultrascanner]
    info:
      path: UltraScannerShare/Info.plist
      properties:
        CFBundleDisplayName: UltraScanner
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Aparece si entre lo compartido hay al menos una imagen o un PDF.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf").@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.com.claudita.ultrascanner.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual # igual que la app
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: UltraScanner Compartir Dev
        DEVELOPMENT_TEAM: C6XD8H2J47

  UltraScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UltraScannerTests
    dependencies:
      - target: UltraScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: C6XD8H2J47

packages:
  # Fork de GRDB mantenido por SQLCipher (mismo API, con cifrado). La llave solo se usa en
  # Release; ver DatabaseManager.
  GRDB:
    url: https://github.com/sqlcipher/GRDB.swift
    from: 7.11.1
  # Anuncios (igual que UltraVocal): AdMob y su formulario de consentimiento.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
  # Uso de la app, sin contenido de los documentos (Analytics/AppAnalytics.swift).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
