name: UltraScanner
options:
  bundleIdPrefix: com.efegord
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  UltraScanner:
    type: application
    platform: iOS
    sources:
      - path: UltraScanner
    info:
      path: UltraScanner/Info.plist
      properties:
        CFBundleDisplayName: UltraScanner
        UILaunchScreen: {}
        NSCameraUsageDescription: "UltraScanner necesita la cámara para escanear tus documentos."
        NSFaceIDUsageDescription: "Usamos Face ID para que solo tú puedas abrir tus documentos."
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
    settings:
      base:
        # Se conserva el identificador original: cambiarlo instalaría otra app y la actual
        # perdería el acceso a sus documentos cifrados.
        PRODUCT_BUNDLE_IDENTIFIER: com.efegord.scanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: C6XD8H2J47  # Fernando Jimenez Gordillo (Apple Developer Program)
    dependencies:
      - package: GRDB
      - package: GoogleMobileAds
    scheme:
      testTargets:
        - UltraScannerTests

  UltraScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UltraScannerTests
    dependencies:
      - target: UltraScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: C6XD8H2J47

packages:
  # Fork de GRDB mantenido por SQLCipher (mismo API, con cifrado). La llave solo se usa en
  # Release; ver DatabaseManager.
  GRDB:
    url: https://github.com/sqlcipher/GRDB.swift
    from: 7.11.1
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0
