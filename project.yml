name: Scanner
options:
  bundleIdPrefix: com.efegord
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Scanner:
    type: application
    platform: iOS
    sources:
      - path: Scanner
    info:
      path: Scanner/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scanner necesita la cámara para escanear tus documentos."
        NSFaceIDUsageDescription: "Usamos Face ID para que solo tú puedas abrir tus documentos."
        GADApplicationIdentifier: "ca-app-pub-3940256099942544~1458002511"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.efegord.scanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GRDB
      - package: GoogleMobileAds

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0
